name: Security and build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run unit tests
        run: mvn -B -DskipTests=false test

      - name: Generate SBOM
        run: mvn -B -Dsecurity.skip=false org.cyclonedx:cyclonedx-maven-plugin:makeBom

      - name: Run dependency vulnerability scan
        env:
          ODC_NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn -B -Dsecurity.skip=false verify

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-scan
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: ossrh
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Import GPG key
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          printf '%s' "$MAVEN_GPG_PRIVATE_KEY" > private-key.asc
          gpg --batch --pinentry-mode loopback --passphrase "$MAVEN_GPG_PASSPHRASE" --import private-key.asc
          rm private-key.asc

      - name: Publish signed release
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          export GPG_TTY=$(tty)
          export GPG_PASSPHRASE="$MAVEN_GPG_PASSPHRASE"
          mvn -B -Prelease -DskipTests=false -Dsecurity.skip=false -Dgpg.passphrase="$MAVEN_GPG_PASSPHRASE" deploy
